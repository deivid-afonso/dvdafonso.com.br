name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish website
    if: ${{ vars.HOSTINGER_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dvdafonso.com.br
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify CSS and JS
        run: |
          npx --yes csso-cli@4.0.2 styles.css -o styles.css
          npx --yes terser@5.31.0 script.js -o script.js --compress --mangle

      - name: Update sitemap lastmod
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>${DATE}</lastmod>|" sitemap.xml

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/HISTORICO-PROJETO.md
            **/node_modules/**
            **/tests/**
            **/playwright-report/**
            **/package.json
            **/package-lock.json
            **/playwright.config.*
            **/.htmlvalidate.json
