name: Validate website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required files
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f contact.php
          test -f csrf-token.php
          test -f favicon.svg
          test -f robots.txt
          test -f sitemap.xml
          test -f .htaccess
          test -d fonts
          test -f fonts/dm-sans-latin.woff2
          test -f fonts/space-grotesk-latin.woff2
          test -f og-image.png

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Validate PHP syntax
        run: |
          php -l contact.php
          php -l csrf-token.php

      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: npm test

      - name: Validate HTML structure
        run: npx --yes html-validate@9.4.0 --config .htmlvalidate.json index.html

      - name: Check for accidental secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
